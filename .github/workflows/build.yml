name: build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
          # 用較舊的 Ubuntu 建置，產出的執行檔可在較多 Linux 發行版上執行
          - os: ubuntu-22.04
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: "1"     # 測試與腳本輸出含中文；GitHub 的 Windows 主機主控台預設是 cp1252
    steps:
      - uses: actions/checkout@v7

      - name: Linux 系統函式庫（Qt xcb 外掛所需，會一併打包）
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-cursor0 libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-render-util0 libxcb-xinerama0 libxcb-shape0 libegl1 fonts-noto-cjk

      - name: 建立自帶環境並打包（Windows）
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # 外部程式（pytest、PyInstaller…）失敗時要讓步驟失敗；pwsh 預設只看步驟最後一個指令
          $PSNativeCommandUseErrorActionPreference = $true
          ./scripts/setup.ps1
          ./scripts/test.ps1; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./scripts/build.ps1
          .venv/Scripts/python.exe tests/smoke_package.py dist/Divebird/Divebird.exe

      - name: 建立自帶環境並打包（Linux）
        if: runner.os == 'Linux'
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          ./scripts/setup.sh
          ./scripts/test.sh
          ./scripts/build.sh
          .venv/bin/python tests/smoke_package.py dist/Divebird/Divebird

      - uses: actions/upload-artifact@v7
        with:
          name: Divebird-${{ runner.os }}
          if-no-files-found: error   # 打包沒有產出時讓 CI 失敗，不要只發警告
          path: |
            dist/*.zip
            dist/*.tar.gz

  # 每次都收齊兩個平台的檔案並產生校驗碼（檢查發佈流程）；推送 v* 標籤時才真的發佈到 GitHub Releases
  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - name: 產生 SHA256 校驗碼
        run: |
          cd artifacts
          ls -l
          # 兩個平台的檔案必須各一個（分兩行：bash -e 不會因 && 串列中間的失敗而中止）
          test "$(ls *-windows-x64.zip | wc -l)" -eq 1
          test "$(ls *-linux-*.tar.gz | wc -l)" -eq 1
          sha256sum *.zip *.tar.gz > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            artifacts/*.zip
            artifacts/*.tar.gz
            artifacts/SHA256SUMS.txt
          generate_release_notes: true
